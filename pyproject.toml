[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-convert-mcp"
version = "0.1.0"
description = "Document conversion MCP server (streamable HTTP) + REST API: PDF to Markdown, OCR, spreadsheet parsing, URL to clean text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.5",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "slowapi==0.1.10",
    "pypdf==6.19.0",
    "Pillow==12.3.0",
    "pytesseract==0.3.13",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "stripe==15.6.1",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
